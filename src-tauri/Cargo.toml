[package]
name = "app"
version = "0.2.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-oauth = "2.0.0"
tauri-plugin-shell = "2.3.5"
tauri-plugin-http = "2"
tauri-plugin-fs = "2"
tauri-plugin-deep-link = "2"

# Android only. tauri-plugin-fs cannot reach shared storage on Android: every
# BaseDirectory it offers resolves through getExternalFilesDir(), i.e.
# Android/data/com.lorehaven.games/files/... — written successfully, hidden from
# the gallery, and effectively unreachable in a file manager. Public
# Pictures/ needs MediaStore, which is what this plugin wraps.
#
# The version is pinned exactly because the crate and its npm binding
# (tauri-plugin-android-fs-api) must match version-for-version.
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-android-fs = "=29.0.0"
# Android-native features (docs/ANDROID-FEATURES.md). Android only, so the
# desktop builds are unchanged. Pinned to the 2.x line: the newest releases of
# the official plugins are 3.0 alphas for the next Tauri major.
tauri-plugin-notification = "2"
tauri-plugin-haptics = "2"
# The only native share-sheet plugin with a current Android build. A release
# candidate, pinned exactly; its npm binding must match.
tauri-plugin-sharekit = "=0.4.0-rc.7"
# Scan a QR code (a LoreHaven link) with the camera. Official plugin; its npm
# binding (@tauri-apps/plugin-barcode-scanner) is pinned to the same version.
# Not 2.5: it needs tauri 2.12, and this app is on 2.11 (see ANDROID-FEATURES.md).
tauri-plugin-barcode-scanner = "=2.4.6"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
