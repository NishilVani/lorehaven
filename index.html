<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The 4c "Shelf" mark, padded field. Its own black tile rather than a
         transparent glyph, so it reads on light and dark browser chrome alike.
         The cropped, currentColor version used in the UI is LogoMark.jsx. -->
    <link rel="icon" type="image/svg+xml" href="/lorehaven-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>LoreHaven</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet"/>
    <!-- The wordmark and the tagline.
         Bytesized and Press Start 2P are both single-weight pixel faces; neither
         has a second cut to ask for, so no weight axis is requested. -->
    <link href="https://fonts.googleapis.com/css2?family=Bytesized&family=Press+Start+2P&display=swap" rel="stylesheet"/>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
