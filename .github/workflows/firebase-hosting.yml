name: Deploy web

# Deploys the web app to Firebase Hosting.
#
#   called by main.yml  -> the live channel of lorehaven.web.app, after CI is green,
#                          and then moctalegames.web.app as a redirect to it
#   pull request        -> a throwaway 7-day preview channel, with the URL commented on the PR
#
# Two Hosting sites, mapped as deploy targets in .firebaserc. `app` is the
# `lorehaven` site. `legacy` is `moctalegames`, the project's default site, which
# Firebase does not allow deleting; it now only redirects. It was retired on
# 2026-09-12 after its last 30 days of Hosting downloads came to 3.63 MB, a
# handful of page loads, and no account other than the maintainer's had signed in
# since it was first deployed.
#
# This workflow used to run lint, unit tests and build itself before deploying,
# duplicating ci.yml. That is gone. On the live path main.yml will not reach this
# job unless the suite passed, and on the pull-request path CI runs against the
# same commit as its own required check. `npm run build` stays because the deploy
# needs the artefact, not because it is a gate.
#
# A preview channel is therefore deployed even when CI is red, which is
# deliberate: a preview is throwaway and looking at a broken build is often the
# fastest way to understand why it broke. Nothing reaches the live channel that
# way -- that path runs only from main.yml, behind `needs: test`.

on:
  pull_request:
    branches: [main]
  workflow_call:

# Never let two deploys of the same ref race each other to the live channel.
concurrency:
  group: hosting-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    # A pull request from a fork gets no secrets -- GitHub withholds them
    # deliberately, so a fork cannot exfiltrate them. The deploy credential
    # would therefore be empty and this job would fail on every external
    # contribution, on a step the contributor cannot fix, next to a comment
    # step that also cannot run because the token is read-only on a fork.
    #
    # Skipping is honest: there is nothing here a fork PR can do. `CI` runs on
    # forks, uses no secrets, and is the check that actually judges the change.
    #
    # github.event_name is the ORIGINAL event even when this workflow is called
    # by another, so on the live path it reads 'push' and this passes.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      # Two separate live deploys, app first. As separate steps the redirect is
      # only published once the app deploy has succeeded, so moctalegames.web.app
      # never sends anyone to a lorehaven.web.app that failed to update.
      - name: Deploy the app to lorehaven.web.app
        if: github.event_name == 'push'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MOCTALEGAMES }}
          projectId: moctalegames
          channelId: live
          target: app

      - name: Redirect moctalegames.web.app to lorehaven.web.app
        if: github.event_name == 'push'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MOCTALEGAMES }}
          projectId: moctalegames
          channelId: live
          target: legacy

      # Previews are of the app only. A preview of a site that redirects every
      # path to production would show a pull request nothing about itself.
      - name: Deploy to preview channel
        if: github.event_name == 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MOCTALEGAMES }}
          projectId: moctalegames
          expires: 7d
          target: app
