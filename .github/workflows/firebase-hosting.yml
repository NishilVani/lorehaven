name: Deploy web

# Continuous deployment of the web app to Firebase Hosting.
#
#   push to main  -> builds, tests, deploys to the live channel (moctalegames.web.app)
#   pull request  -> builds and deploys to a throwaway preview channel, and comments
#                    the preview URL on the PR
#
# The tests run before the deploy in the same job on purpose: a red suite must
# not be able to reach the live site.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Never let two deploys of the same ref race each other to the live channel.
concurrency:
  group: hosting-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    # A pull request from a fork gets no secrets -- GitHub withholds them
    # deliberately, so a fork cannot exfiltrate them. The deploy credential
    # would therefore be empty and this job would fail on every external
    # contribution, on a step the contributor cannot fix, next to a comment
    # step that also cannot run because the token is read-only on a fork.
    #
    # Skipping is honest: there is nothing here a fork PR can do. `CI` runs on
    # forks, uses no secrets, and is the check that actually judges the change.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A hard gate. The backlog that made this advisory is cleared: eslint
      # reports zero errors, and the four suppressions that remain each carry
      # their reason at the point of use.
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Deploy to live channel
        if: github.event_name == 'push'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MOCTALEGAMES }}
          projectId: moctalegames
          channelId: live

      - name: Deploy to preview channel
        if: github.event_name == 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MOCTALEGAMES }}
          projectId: moctalegames
          expires: 7d
