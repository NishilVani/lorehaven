name: Release

# Builds every platform, publishes the GitHub Release, tells running clients a
# new version exists, and submits the package to the Microsoft Store.
#
# Three ways in, one path through:
#
#   workflow_call     main.yml calls this when the version in
#                     src-tauri/tauri.conf.json changes on main. The normal path.
#                     The tag does not exist yet and is created here.
#   push tag v*       You pushed a tag by hand. Kept as the escape hatch for a
#                     release main.yml did not cut.
#   workflow_dispatch Re-run a release for a tag that already exists.
#
# The tag creates a draft release, the desktop matrix and the Android job attach
# their bundles to it, and `publish` undrafts it. Nothing goes public until every
# platform has uploaded, so a half-built release is never visible.
#
# On creating the tag: the `release tag protection` ruleset on `v*` restricts
# updates, deletions and force pushes, but NOT creations, and that gap is what
# lets this job make the tag. It cannot be closed with a bypass entry instead:
# a ruleset bypass list takes roles, teams, GitHub Apps and Dependabot, never
# the workflow's GITHUB_TOKEN, so with "Restrict creations" on, create-release
# fails with a ruleset violation. Leaving creation open is safe because every
# job that signs or publishes waits for the production approval, and nothing
# can move or delete a release tag once it exists.

on:
  workflow_call:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 0.2.0)"
        required: true
        type: string
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (created if it does not exist)"
        required: true

permissions:
  contents: write

# Every job below that holds a secret declares `environment: production`, which
# has a required reviewer. GitHub pauses those jobs until a human approves the
# run, so signing keys, publishing and Firestore writes cannot happen because
# somebody pushed a tag or clicked "Run workflow".
#
# The branch ruleset only governs merges into main. A tag is not a branch and a
# workflow_dispatch is not a merge, so before this the release path went around
# it entirely.
jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
      upload_url: ${{ steps.create.outputs.upload_url }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          # One resolution for all three triggers. On workflow_call the version
          # arrives already stripped; the other two carry a tag to strip. Never
          # falls back to github.ref_name on the called path, where it would be
          # "main" and would silently release a version called main.
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            TAG="${{ inputs.tag || github.ref_name }}"
            VERSION="${TAG#v}"
          fi
          if [ -z "$VERSION" ]; then
            echo "Could not resolve a version from this trigger." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION"

      - name: Check the version matches tauri.conf.json
        run: |
          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          TAG_VERSION="${{ steps.version.outputs.version }}"
          if [ "$CONF" != "$TAG_VERSION" ]; then
            echo "Version $TAG_VERSION does not match tauri.conf.json version $CONF." >&2
            echo "Bump src-tauri/tauri.conf.json, or retag." >&2
            exit 1
          fi
          echo "Version $CONF matches."

      - name: Create draft release
        id: create
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          # Creates the tag when it does not exist, at the commit this run was
          # started from. On the tag-push path the tag is already here and this
          # is a no-op.
          target_commitish: ${{ github.sha }}
          name: LoreHaven ${{ steps.version.outputs.version }}
          draft: true
          generate_release_notes: true

  desktop:
    name: Desktop (${{ matrix.label }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - label: macOS (Intel)
            platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - label: Linux
            platform: ubuntu-22.04
            args: ""
          - label: Windows
            platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            build-essential \
            file \
            wget

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Authenticode signing, for the MSI and NSIS installers people download
      # straight from GitHub — unsigned, those raise a SmartScreen warning. It is
      # NOT needed for the Store: that listing is an MSIX, which Microsoft
      # re-signs itself. Without the secrets the build still succeeds and simply
      # produces unsigned installers. See docs/MICROSOFT-STORE.md.
      - name: Configure Windows code signing
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          # The secrets context is not available in a step-level `if`, so the
          # presence check happens here rather than in a condition.
          if ([string]::IsNullOrWhiteSpace($env:CERT_BASE64)) {
            Write-Host "::warning::WINDOWS_CERTIFICATE_BASE64 is not set - the MSI and NSIS installers will be unsigned and will raise a SmartScreen warning on download. The Store listing is unaffected; it is an MSIX and Microsoft signs it."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_BASE64))
          $password = ConvertTo-SecureString -String $env:CERT_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx -Force
          # tauri.windows.conf.json is merged into tauri.conf.json automatically on
          # Windows, so the thumbprint never has to be committed.
          @{
            bundle = @{
              windows = @{
                certificateThumbprint = $cert.Thumbprint
                digestAlgorithm       = "sha256"
                timestampUrl          = "http://timestamp.digicert.com"
              }
            }
          } | ConvertTo-Json -Depth 5 | Set-Content src-tauri/tauri.windows.conf.json -Encoding utf8
          Write-Host "Signing configured for thumbprint $($cert.Thumbprint)"

      - name: Build and upload bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

      # The Microsoft Store listing is MSIX, which the Store re-signs itself —
      # that is why it needs no code-signing certificate. Tauri has no MSIX
      # bundle target, so the executable tauri-action just built is packed here
      # with makeappx. The Partner Center identity is in the manifest; nothing
      # about this step needs configuring.
      - name: Pack MSIX for the Microsoft Store
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: ./scripts/pack_msix.ps1 -Version '${{ needs.create-release.outputs.version }}'

      - name: Attach the MSIX to the draft release
        if: matrix.platform == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          draft: true
          files: msix-out/*.msix

  android:
    name: Android
    needs: create-release
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018"

      - name: Point the build at the NDK
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # The signing key never lives in the repository. It is a base64 blob in
      # Actions secrets, written to disk here and read by app/build.gradle.kts
      # through the same keystore.properties a local release build uses.
      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set. See docs/RELEASING.md." >&2
            exit 1
          fi
          cd src-tauri/gen/android/app
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      # APK, not AAB. An .aab is a Play Store upload format and cannot be
      # installed on a device; this project does not ship to Play, so the APK
      # goes into the same GitHub Release as the desktop bundles and is
      # sideloaded from there.
      - name: Build APK
        run: npm run tauri android build -- --apk

      - name: Collect the APKs
        id: collect
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          OUT="$RUNNER_TEMP/android-out"
          mkdir -p "$OUT"

          # One universal APK, carrying every ABI, so a single file installs on
          # any device. `tauri android build --apk` produces only this — verified
          # by running it: per-ABI files need --split-per-abi, which produces
          # them *instead of* the universal one, not alongside it. For a sideload
          # channel one file that always works beats the size saving. It is large
          # (84.6 MB at v0.1.0): four architectures of compiled Rust.
          find src-tauri/gen/android/app/build/outputs -name '*universal*release*.apk' \
            -exec sh -c 'cp "$1" "$2/LoreHaven-$3-universal.apk"' _ {} "$OUT" "$VERSION" ';'

          # Fail loudly rather than publishing a release with no Android build in
          # it: a rename upstream would otherwise pass silently.
          if [ -z "$(ls -A "$OUT")" ]; then
            echo "No APK matched. Everything under outputs/:" >&2
            find src-tauri/gen/android/app/build/outputs -name '*.apk' >&2
            exit 1
          fi
          ls -la "$OUT"
          echo "dir=$OUT" >> "$GITHUB_OUTPUT"

      - name: Attach to the draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          draft: true
          files: ${{ steps.collect.outputs.dir }}/*

      # Leaving a decrypted signing key on a runner is how keys leak out of CI.
      # This runs even when the build above fails.
      - name: Shred the keystore
        if: always()
        run: |
          rm -f src-tauri/gen/android/app/release.keystore \
                src-tauri/gen/android/app/keystore.properties

  publish:
    name: Publish release
    needs: [create-release, desktop, android]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Undraft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/releases/${{ needs.create-release.outputs.release_id }}" \
            -f draft=false

  # Tell the running clients a newer version exists, by writing latestVersion
  # into the Firestore document config/app.
  #
  # It CANNOT arm the compatibility gate. scripts/app_config_payload.mjs builds
  # the release object from named locals rather than spreading its input, so
  # minCompatLevel has no route into a release write, and the script re-reads
  # the document afterwards and fails the job if that field moved. Raising it is
  # arm-compat-gate.yml, which only a human can trigger -- doing it here would
  # gate every device that had not yet installed this release.
  #
  # `needs: publish` so nothing is advertised until the release is actually
  # public. A failed desktop or Android leg leaves the release a draft, and
  # pointing users at a draft would be pointing them at nothing.
  #
  # Without the secret the step is skipped rather than failed: an unpublished
  # latestVersion costs nothing today, because the client's config read fails
  # open and every client still treats itself as current.
  app-config:
    name: Publish latestVersion
    needs: [create-release, publish]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-save firebase-admin@13

      - name: Write latestVersion to config/app
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CONFIG_WRITER }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          if [ -z "$GOOGLE_APPLICATION_CREDENTIALS_JSON" ]; then
            echo "::warning::FIREBASE_CONFIG_WRITER is not set - latestVersion was not published. Clients still treat themselves as current, because the config read fails open. See docs/RELEASING.md."
            exit 0
          fi
          node scripts/publish_app_config.mjs release \
            --version "$VERSION" \
            --notes "LoreHaven $VERSION"

  # Submits the MSIX to the Microsoft Store.
  #
  # This was its own workflow, triggered by `workflow_run` on this one finishing,
  # and before that by `release: published`. The second of those never fired at
  # all: this workflow undrafts the release with GITHUB_TOKEN, and GitHub
  # deliberately does not let a GITHUB_TOKEN action emit events that start
  # further workflow runs, so the workflow sat at zero runs looking healthy. The
  # workflow_run replacement worked, but it re-derived the tag from
  # `head_branch`, re-downloaded an asset this run had just built, and failed
  # open on anything it could not parse.
  #
  # As a job it needs none of that. `needs: publish` is a real dependency rather
  # than an inferred one, and the version is the same string the rest of the run
  # used. store-submission.yml survives as a dispatch-only workflow, for
  # resubmitting a release that already exists.
  store:
    name: Submit to the Microsoft Store
    needs: [create-release, publish]
    runs-on: windows-latest
    environment: production
    steps:
      # A tagged release with no credentials fails, deliberately: a green run
      # that submitted nothing is the exact failure mode this path already had
      # once, and it hid for weeks.
      - name: Check the Store credentials are present
        shell: pwsh
        env:
          TENANT: ${{ secrets.AZURE_AD_TENANT_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TENANT)) {
            Write-Error "Store credentials are not set, so ${{ needs.create-release.outputs.tag }} was published but not submitted to the Store. See docs/MICROSOFT-STORE.md."
            exit 1
          }

      - name: Download the MSIX from the release
        id: fetch
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ needs.create-release.outputs.tag }}"
          $asset = "LoreHaven-${{ needs.create-release.outputs.version }}.msix"

          New-Item -ItemType Directory -Force -Path release | Out-Null
          gh release download $tag --pattern $asset --dir release --repo ${{ github.repository }}
          if ($LASTEXITCODE -ne 0) {
            Write-Error "No $asset on release $tag. Did the Windows leg succeed?"
            exit 1
          }

          $path = (Resolve-Path "release/$asset").Path
          Write-Host "Got $path ($([math]::Round((Get-Item $path).Length / 1MB, 2)) MB)"
          "msix=$path" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # v1.4, the action's latest release (2026-07-21). Microsoft's own guide
      # still shows v1.1; the action repository's README and releases are the
      # fresher source.
      - uses: microsoft/microsoft-store-apppublisher@v1.4

      - name: Configure MSStore CLI
        shell: pwsh
        run: |
          msstore reconfigure `
            --tenantId ${{ secrets.AZURE_AD_TENANT_ID }} `
            --sellerId ${{ secrets.SELLER_ID }} `
            --clientId ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }} `
            --clientSecret ${{ secrets.AZURE_AD_APPLICATION_SECRET }}

      - name: Publish the package
        shell: pwsh
        # 9N7FD5QBSMBB is the Store ID for LoreHaven. It is public — it is the
        # listing URL, https://apps.microsoft.com/detail/9N7FD5QBSMBB — so it
        # lives here rather than in a variable.
        #
        # The .msix goes in as the positional argument, the form Microsoft's own
        # GitHub Actions guide uses for MSIX package updates. The command
        # reference describes that argument as a project directory and offers
        # -i for a package file, but the one reported failure of this command
        # (microsoft/msstore-cli#50, closed) was -i pointed at a directory, not a
        # file passed directly. -v keeps the upload and the submission in the
        # log, which is the only place a failed submission can be traced from.
        #
        # publish commits the submission, so this sends it to certification. It
        # also replaces any unsubmitted draft in Partner Center with one built
        # from the last published submission. A green step means submitted, not
        # live.
        run: msstore publish "${{ steps.fetch.outputs.msix }}" -id 9N7FD5QBSMBB -v

      # Read-only: puts the submission's state in the log, so a run shows what
      # Partner Center accepted without anyone signing in to check. Allowed to
      # fail, because by this point the submission already exists and a failed
      # status read must not turn a successful submission red.
      - name: Report the submission status
        shell: pwsh
        continue-on-error: true
        run: msstore submission status 9N7FD5QBSMBB
