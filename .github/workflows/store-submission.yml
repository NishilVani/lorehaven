name: Store — submit release

# Pushes a released Windows installer to the Microsoft Store.
#
# The Store requires a *versioned, immutable* download URL: the binary behind a
# submitted URL must never change, and every update needs a new URL. A GitHub
# Release asset is exactly that — /releases/download/v1.2.3/... is frozen once
# the release is published. (This is why the workflow does NOT use
# /releases/latest/download/..., which is a moving target and would break the
# requirement.)
#
# Runs automatically when the Release workflow publishes a release, so a Store
# submission can never point at a draft or a half-uploaded asset.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to submit (e.g. v0.1.0)"
        required: true

permissions:
  contents: read

jobs:
  submit:
    name: Update and publish submission
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the installer URL
        id: installer
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "${{ github.event.release.tag_name }}" }
          $version = $tag -replace '^v', ''
          # Tauri's WiX bundle name: {productName}_{version}_{arch}_{language}.msi
          $asset = "LoreHaven_${version}_x64_en-US.msi"
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/$asset"

          # Fail loudly here rather than handing Partner Center a 404, which it
          # would only reject days later during certification.
          try {
            $head = Invoke-WebRequest -Uri $url -Method Head -MaximumRedirection 5 -ErrorAction Stop
            Write-Host "Installer reachable: $url ($($head.Headers.'Content-Length') bytes)"
          } catch {
            Write-Error "No installer at $url. Did the Windows job of the Release workflow succeed?"
            exit 1
          }

          "url=$url"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Point the submission at this release
        shell: pwsh
        run: |
          $path = "store/package.json"
          if (-not (Test-Path $path)) {
            Write-Error "store/package.json is missing. Run the 'Store - fetch base submission' workflow once and commit the result. See docs/MICROSOFT-STORE.md."
            exit 1
          }

          $submission = Get-Content -Raw $path | ConvertFrom-Json
          if (-not $submission.packages -or $submission.packages.Count -eq 0) {
            Write-Error "store/package.json has no packages array to update."
            exit 1
          }

          # Patch only the URL. Everything else — installer parameters, languages,
          # architectures — is whatever Partner Center already accepted.
          foreach ($package in $submission.packages) {
            $package.packageUrl = "${{ steps.installer.outputs.url }}"
          }

          $json = $submission | ConvertTo-Json -Depth 20 -Compress
          $json | Set-Content -Path $path -Encoding utf8
          Write-Host "Submission now points at ${{ steps.installer.outputs.url }}"

      - uses: microsoft/microsoft-store-apppublisher@v1.1

      - name: Configure MSStore CLI
        shell: pwsh
        run: |
          msstore reconfigure `
            --tenantId ${{ secrets.AZURE_AD_TENANT_ID }} `
            --sellerId ${{ secrets.SELLER_ID }} `
            --clientId ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }} `
            --clientSecret ${{ secrets.AZURE_AD_APPLICATION_SECRET }}

      - name: Update submission
        shell: pwsh
        run: |
          $updatedPackage = Get-Content -Raw "${{ github.workspace }}/store/package.json"
          msstore submission update ${{ vars.MS_STORE_PRODUCT_ID }} $updatedPackage

      - name: Publish submission
        shell: pwsh
        run: msstore submission publish ${{ vars.MS_STORE_PRODUCT_ID }}
