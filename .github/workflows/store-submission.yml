name: Store — resubmit a release

# Submits the MSIX from an EXISTING GitHub Release to the Microsoft Store, by
# hand.
#
# The automatic submission is no longer here. It is the `store` job in
# release.yml, which runs after `publish` in the same run that built the package.
# This workflow is only the manual path: a submission that failed certification
# and needs sending again, a release cut before the Store credentials existed, or
# a resubmission of an older version.
#
# MSIX rather than MSI/EXE, and that choice is what makes this free: the Store
# re-signs MSIX packages with a Microsoft certificate after certification and
# hosts the download itself, so there is no code-signing certificate to buy and
# no installer URL to keep alive. An MSI/EXE listing gets neither — the Store
# does not re-sign those, and you must Authenticode-sign them yourself.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to submit (e.g. v0.1.0)"
        required: true

permissions:
  contents: read

# `environment: production` has a required reviewer, so a submission pauses until
# a human approves the run. Clicking "Run workflow" is not on its own enough to
# put a build in front of Microsoft.
jobs:
  submit:
    name: Publish to the Store
    runs-on: windows-latest
    environment: production
    steps:
      - name: Check the tag and the credentials
        id: check
        shell: pwsh
        env:
          TENANT: ${{ secrets.AZURE_AD_TENANT_ID }}
        run: |
          $tag = "${{ inputs.tag }}"
          if (-not $tag.StartsWith('v')) {
            Write-Error "'$tag' is not a release tag. Expected something like v0.1.0."
            exit 1
          }
          if ([string]::IsNullOrWhiteSpace($env:TENANT)) {
            Write-Error "Store credentials are not set. See docs/MICROSOFT-STORE.md."
            exit 1
          }
          $version = $tag -replace '^v', ''
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Download the MSIX from the release
        id: fetch
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ inputs.tag }}"
          $asset = "LoreHaven-${{ steps.check.outputs.version }}.msix"

          New-Item -ItemType Directory -Force -Path release | Out-Null
          gh release download $tag --pattern $asset --dir release --repo ${{ github.repository }}
          if ($LASTEXITCODE -ne 0) {
            Write-Error "No $asset on release $tag. Did the Windows leg of that release succeed?"
            exit 1
          }

          $path = (Resolve-Path "release/$asset").Path
          Write-Host "Got $path ($([math]::Round((Get-Item $path).Length / 1MB, 2)) MB)"
          "msix=$path" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # v1.4, the action's latest release (2026-07-21). Microsoft's own guide
      # still shows v1.1; the action repository's README and releases are the
      # fresher source.
      - uses: microsoft/microsoft-store-apppublisher@v1.4

      - name: Configure MSStore CLI
        shell: pwsh
        run: |
          msstore reconfigure `
            --tenantId ${{ secrets.AZURE_AD_TENANT_ID }} `
            --sellerId ${{ secrets.SELLER_ID }} `
            --clientId ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }} `
            --clientSecret ${{ secrets.AZURE_AD_APPLICATION_SECRET }}

      - name: Publish the package
        shell: pwsh
        # 9N7FD5QBSMBB is the Store ID for LoreHaven. It is public — it is the
        # listing URL, https://apps.microsoft.com/detail/9N7FD5QBSMBB — so it
        # lives here rather than in a variable.
        #
        # The .msix goes in as the positional argument, the form Microsoft's own
        # GitHub Actions guide uses for MSIX package updates. The command
        # reference describes that argument as a project directory and offers
        # -i for a package file, but the one reported failure of this command
        # (microsoft/msstore-cli#50, closed) was -i pointed at a directory, not a
        # file passed directly. -v keeps the upload and the submission in the
        # log, which is the only place a failed submission can be traced from.
        #
        # publish commits the submission, so this sends it to certification. It
        # also replaces any unsubmitted draft in Partner Center with one built
        # from the last published submission. A green step means submitted, not
        # live.
        run: msstore publish "${{ steps.fetch.outputs.msix }}" -id 9N7FD5QBSMBB -v

      # Read-only: puts the submission's state in the log, so a run shows what
      # Partner Center accepted without anyone signing in to check. Allowed to
      # fail, because by this point the submission already exists and a failed
      # status read must not turn a successful submission red.
      - name: Report the submission status
        shell: pwsh
        continue-on-error: true
        run: msstore submission status 9N7FD5QBSMBB
