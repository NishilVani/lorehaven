name: CI

# The single definition of "green" for this repository.
#
# There used to be two. This workflow ran lint, unit tests, build and Playwright;
# `firebase-hosting.yml` ran lint, unit tests and build again, inline, before it
# deployed. Two copies of a gate do not stay identical, and these had already
# drifted -- one ran Playwright and the other did not -- so "the tests passed"
# meant something different depending on which run you happened to open. The
# copy is gone; this workflow is now called rather than duplicated.
#
# Triggers:
#   pull_request  -- runs directly. That matters more than it looks: the branch
#                    ruleset on main requires a status check named "Lint, test,
#                    build", and a check's context is the job name. Called from
#                    another workflow the context becomes "<caller-job> / Lint,
#                    test, build", which the ruleset would never match, and every
#                    pull request would be unmergeable until somebody edited the
#                    ruleset. Keeping the direct trigger keeps the name.
#   workflow_call -- how main.yml gates the deploy and the release on ONE test
#                    run rather than one per consumer.

on:
  pull_request:
    branches: [main]
  workflow_call:

# Keyed on the workflow as well as the ref: when main.yml calls this, github.ref
# is refs/heads/main for both, and a shared group would have the caller and the
# callee cancelling each other.
#
# Cancelling is limited to pull requests, which is the case it was added for --
# a force-push should not leave the superseded run burning a runner. On main it
# would be actively harmful: a second push would cancel the first push's test
# job, and if the first was the commit that bumped the version, its release is
# cancelled with it and that version is never cut. Nothing then retries it,
# because the next push sees the version already matching its parent.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: Playwright (chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Blocking, and that is what gates the deploy and the release on it:
      # main.yml's web and release jobs need the whole of this workflow to pass.
      # It was advisory while it failed on every run, for reasons that had
      # nothing to do with the commit under test -- specs read live IGDB through
      # the deployed Worker, the /import fixtures sat in the gitignored qa/
      # folder where no fresh checkout could find them, and five cases were real
      # bugs. Now no spec reaches IGDB, Wikidata or production Firestore (see the
      # webServer and project comments in playwright.config.ts), so a red run
      # means the code. Before continue-on-error was removed, exactly this
      # command ran twice back to back: 419 passed, 2 skipped, 0 failed, 0 flaky.
      #
      # On a pull request it reports but does not stop the merge: the branch
      # ruleset on main requires "Lint, test, build" only. Adding "Playwright
      # (chromium)" to that ruleset is what would make it block there too.
      #
      # `retries: 2` in playwright.config.ts can still turn a failure into a
      # pass. A retried case is listed as flaky in the report uploaded below;
      # treat one as a bug, not as noise.
      - name: Run e2e
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
