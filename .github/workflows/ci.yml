name: CI

# The single definition of "green" for this repository: lint, unit tests and a
# production build. It is the one gate on the web deploy and on the release.
#
# There used to be two copies. `firebase-hosting.yml` ran lint, unit tests and
# build again, inline, before it deployed, and the copies had already drifted --
# one ran Playwright and the other did not -- so "the tests passed" meant
# something different depending on which run you happened to open. The copy is
# gone; this workflow is now called rather than duplicated.
#
# Playwright used to be a second job in this file, which put it on the deploy
# path: main.yml gates the deploy and the release with `needs: test`, and a
# `needs` on a called workflow waits for every job inside it. Once the suite
# became blocking, every push to main deployed about ten minutes late -- on the
# run for 6c8e891 (2026-09-12) the deploy started 10.1 minutes after lint, unit
# tests and build had passed. It now runs from its own workflow, e2e.yml, which
# checks pull requests and never holds up the deploy.
#
# Triggers:
#   pull_request  -- runs directly. That matters more than it looks: the branch
#                    ruleset on main requires a status check named "Lint, test,
#                    build", and a check's context is the job name. Called from
#                    another workflow the context becomes "<caller-job> / Lint,
#                    test, build", which the ruleset would never match, and every
#                    pull request would be unmergeable until somebody edited the
#                    ruleset. Keeping the direct trigger keeps the name.
#   workflow_call -- how main.yml gates the deploy and the release on ONE test
#                    run rather than one per consumer.

on:
  pull_request:
    branches: [main]
  workflow_call:

# Keyed on the workflow as well as the ref: when main.yml calls this, github.ref
# is refs/heads/main for both, and a shared group would have the caller and the
# callee cancelling each other.
#
# Cancelling is limited to pull requests, which is the case it was added for --
# a force-push should not leave the superseded run burning a runner. On main it
# would be actively harmful: a second push would cancel the first push's test
# job, and if the first was the commit that bumped the version, its release is
# cancelled with it and that version is never cut. Nothing then retries it,
# because the next push sees the version already matching its parent.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
